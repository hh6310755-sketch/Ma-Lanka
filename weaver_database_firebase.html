<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handloom Weaver Database</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fcfcfc;
    --surface: #0c0c0c;
    --card: #110c01;
    --border: #f8f8f7;
    --gold: #f7f5f1;
    --gold-light: #f8bd28;
    --gold-dim: #8a6f2e;
    --text: #f0ead8;
    --text-muted: #f8f2f2;
    --red: #f82007;
    --green: #2ecc71;
    --accent: #fcfbfb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 50vh;
    background-image: 
      radial-gradient(ellipse at 10% 20%, rgba(248, 248, 241, 0.884) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(16, 230, 230, 0.04) 0%, transparent 50%);
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #e0ece8 0%, #0a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 15px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(40px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold-light));
    border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }

  .logo-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--gold-light);
    letter-spacing: 0.5px;
  }

  .logo-text p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 30px;
  }

  .hstat {
    text-align: center;
  }

  .hstat-num {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--gold);
    font-weight: 700;
  }

  .hstat-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* MAIN LAYOUT */
  .app {
    max-width: 1300px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* SEARCH SECTION */
  .search-section {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 28px;
    padding: 28px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .search-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(100deg, transparent, var(--gold), transparent);
  }

  .search-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .search-input-wrap {
    position: relative;
    flex: 1;
    max-width: 360px;
  }

  .search-input-wrap span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 16px;
  }

  .search-input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus {
    border-color: var(--gold);
  }

  .search-input::placeholder { color: var(--text-muted); }

  .btn {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #fdfdfb;
  }

  .btn-gold:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  .btn-green {
    background: linear-gradient(135deg, #0a0a0a, #0e0d0d);
    color: rgb(247, 243, 243);
  }

  .btn-green:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-sm {
    padding: 7px 14px;
    font-size: 12px;
    border-radius: 7px;
  }

  /* PROFILE CARD */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 28px;
    display: none;
    animation: fadeIn 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .profile-card.active { display: block; }

  .profile-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 50px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #181818;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid var(--gold-dim);
  }

  .profile-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .weaver-id-badge {
    display: inline-block;
    background: rgba(245, 244, 243, 0.12);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 10px;
  }

  .status-active { background: rgba(8, 8, 8, 0.479); color: #27f80b; border: 1px solid rgba(231, 238, 234, 0.3); }
  .status-inactive { background: rgba(8, 8, 8, 0.459); color: #f71f07; border: 1px solid rgba(192, 58, 43, 0.11); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .profile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .info-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .info-label {
    font-size: 10px;
    color: var(--gold-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 5px;
  }

  .info-value {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }

  /* TABLE */
  .table-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .table-header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .table-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--gold-light);
  }

  .table-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .filter-select {
    padding: 7px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: var(--card);
  }

  th {
    padding: 12px 20px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid rgba(241, 240, 238, 0.158);
    transition: background 0.15s;
    cursor: pointer;
  }

  tbody tr:hover { background: rgba(201,168,76,0.04); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 13px 20px;
    font-size: 13.5px;
    color: var(--text);
  }

  .td-id {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-weight: 700;
    font-size: 14px;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    width: 90%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--gold-light);
    margin-bottom: 24px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  .form-label {
    font-size: 11px;
    color: var(--gold-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .form-input, .form-select {
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus { border-color: var(--gold); }
  .form-input::placeholder { color: var(--text-muted); }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .close-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* EMPTY / NOT FOUND */
  .not-found {
    text-align: center;
    padding: 40px;
    display: none;
  }

  .not-found.active { display: block; }
  .not-found-icon { font-size: 48px; margin-bottom: 12px; }
  .not-found h3 { color: var(--text-muted); font-size: 16px; margin-bottom: 6px; }
  .not-found p { color: var(--text-muted); font-size: 13px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .empty-table {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .tag-center {
    background: rgba(201,168,76,0.1);
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.2);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--card);
    border: 1px solid var(--gold-dim);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 999;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">  🧵  </div>
    <div class="logo-text">
      <h1>Weaver Registry</h1>
      <p>Handloom Management System</p>
    </div>
  </div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-num" id="totalCount">0</div>
      <div class="hstat-label">Total Weavers</div>
    </div>
    <div class="hstat">
      <div class="hstat-num" id="activeCount">0</div>
      <div class="hstat-label">Active</div>
    </div>
    <div class="hstat">
      <div class="hstat-num" id="centerCount">0</div>
      <div class="hstat-label">Centers</div>
    </div>
  </div>
</header>

<div class="app">

  <!-- SEARCH -->
  <div class="search-section">
    <div class="search-title">🔍 Search Weaver</div>
    <div class="search-row">
      <div class="search-input-wrap">
        <span>🪪</span>
        <input class="search-input" id="searchId" type="text" placeholder="Enter Weaver ID (e.g. WV001)" oninput="searchWeaver()" />
      </div>
      <input class="search-input" id="searchName" type="text" placeholder="Search by Name..." oninput="filterTable()" style="flex:1; max-width:260px;" />
      <button class="btn btn-gold" onclick="openAddModal()">+ Add Weaver</button>
      <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
    </div>
  </div>

  <!-- PROFILE CARD -->
  <div class="profile-card" id="profileCard">
    <div class="profile-header">
      <div class="avatar" id="avatarInitial">W</div>
      <div class="profile-info">
        <h2 id="pName">—</h2>
        <span class="weaver-id-badge" id="pId">—</span>
        <span class="status-badge" id="pStatus"><span class="status-dot"></span><span id="pStatusText">Active</span></span>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="editWeaver()">✏️ Edit</button>
        <button class="btn btn-sm" style="background:#c0392b22; color:#fdf8f8; border:1px solid #c0392b44;" onclick="deleteWeaver()">🗑 Delete</button>
      </div>
    </div>
    <div class="profile-grid" id="profileGrid"></div>
  </div>

  <!-- NOT FOUND -->
  <div class="not-found" id="notFound">
    <div class="not-found-icon">🔍</div>
    <h3>Weaver Not Found</h3>
    <p>No weaver found with this ID. Please check and try again.</p>
  </div>

  <!-- TABLE -->
  <div class="table-section">
    <div class="table-header">
      <h3>All Weavers</h3>
      <div class="table-controls">
        <select class="filter-select" id="centerFilter" onchange="filterTable()">
          <option value="">All Centers</option>
          <option>Center 1</option><option>Center 2</option><option>Center 3</option>
          <option>Center 4</option><option>Center 5</option><option>Center 6</option>
          <option>Center 7</option><option>Center 8</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="filterTable()">
          <option value="">All Status</option>
          <option>Active</option><option>Inactive</option>
        </select>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Weaver ID</th>
          <th>Full Name</th>
          <th>Phone</th>
          <th>Center</th>
          <th>District</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="weaverTableBody"></tbody>
    </table>
    <div class="empty-table" id="emptyTable" style="display:none;">No weavers found.</div>
  </div>

</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">Add New Weaver</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Weaver ID *</label>
        <input class="form-input" id="fId" placeholder="e.g. WV001" />
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fStatus">
          <option>Active</option><option>Inactive</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">First Name *</label>
        <input class="form-input" id="fFirstName" placeholder="First name" />
      </div>
      <div class="form-group">
        <label class="form-label">Last Name *</label>
        <input class="form-input" id="fLastName" placeholder="Last name" />
      </div>
      <div class="form-group">
        <label class="form-label">NIC Number</label>
        <input class="form-input" id="fNic" placeholder="National ID" />
      </div>
      <div class="form-group">
        <label class="form-label">Date of Birth</label>
        <input class="form-input" id="fDob" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-input" id="fPhone" placeholder="07X XXX XXXX" />
      </div>
      <div class="form-group">
        <label class="form-label">Gender</label>
        <select class="form-select" id="fGender">
          <option>Female</option><option>Male</option><option>Other</option>
        </select>
      </div>
      <div class="form-group full">
        <label class="form-label">Address</label>
        <input class="form-input" id="fAddress" placeholder="Full address" />
      </div>
      <div class="form-group">
        <label class="form-label">District</label>
        <input class="form-input" id="fDistrict" placeholder="e.g. Colombo" />
      </div>
      <div class="form-group">
        <label class="form-label">Province</label>
        <input class="form-input" id="fProvince" placeholder="e.g. Western" />
      </div>
      <div class="form-group">
        <label class="form-label">Assigned Center</label>
        <select class="form-select" id="fCenter">
          <option>Shafi Nager Center</option><option> Alim Nager Center </option><option> Poovarasantheevu Center </option>
          <option> Idiman Center </option><option>Faizal nager Center </option><option>RDS Center </option>
          <option>Meera Nager Center </option><option>Arafa Nager Center</option>
          <option>Others </option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Join Date</label>
        <input class="form-input" id="fJoin" type="date" />
      </div>
      <div class="form-group full">
        <label class="form-label">Notes</label>
        <input class="form-input" id="fNotes" placeholder="Any additional notes..." />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" onclick="saveWeaver()">💾 Save Weaver</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwwpwsJq4QFGA_y2PtnrTQyheAmkV8bfw",
  authDomain: "weaver-database-ca7b8.firebaseapp.com",
  projectId: "weaver-database-ca7b8",
  storageBucket: "weaver-database-ca7b8.firebasestorage.app",
  messagingSenderId: "662576121451",
  appId: "1:662576121451:web:641587984a7225a31d932e",
  measurementId: "G-8CXQWJZ58J"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const weaversCol = collection(db, "weavers");

const CENTERS = ['Shafi Nager Center','Alim Nager Center','Poovarasantheevu Center','Idiman Center','Faizal Nager Center','RDS Center','Meera Nager Center','Arafa Nager Center','Others'];

let weavers = [];
let editingId = null;
let currentSearchId = null;
let firstSnapshot = true;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Fill center dropdowns
$('fCenter').innerHTML = CENTERS.map(c => `<option>${c}</option>`).join('');
$('centerFilter').innerHTML = '<option value="">All Centers</option>' + CENTERS.map(c => `<option>${c}</option>`).join('');

// ---- LIVE SYNC ----
onSnapshot(weaversCol, snap => {
  weavers = snap.docs.map(d => d.data()).sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
  updateStats();
  filterTable();
  if (currentSearchId) {
    const w = weavers.find(x => x.id === currentSearchId);
    if (w) showProfile(w); else $('profileCard').classList.remove('active');
  }
  if (firstSnapshot) { firstSnapshot = false; offerLocalMigration(); }
}, err => {
  console.error(err);
  showToast('⚠️ Cloud error: ' + err.code + ' (check Firestore rules)');
});

// One-time upload of data previously saved in this browser
async function offerLocalMigration() {
  if (weavers.length) return;
  let local = [];
  try { local = JSON.parse(localStorage.getItem('handloom_weavers') || '[]'); } catch (e) {}
  if (!local.length) return;
  if (!confirm(`Upload ${local.length} weaver(s) saved in this browser to the cloud database?`)) return;
  const batch = writeBatch(db);
  local.forEach(w => batch.set(doc(weaversCol, w.id), w));
  await batch.commit();
  showToast('✅ Local data uploaded to cloud.');
}

function updateStats() {
  $('totalCount').textContent = weavers.length;
  $('activeCount').textContent = weavers.filter(w => w.status === 'Active').length;
  $('centerCount').textContent = new Set(weavers.map(w => w.center).filter(Boolean)).size;
}

// ---- SEARCH BY ID ----
window.searchWeaver = function () {
  const val = $('searchId').value.trim().toUpperCase();
  $('notFound').classList.remove('active');
  $('profileCard').classList.remove('active');
  if (!val) { currentSearchId = null; return; }
  const w = weavers.find(x => x.id.toUpperCase() === val);
  if (w) { currentSearchId = w.id; showProfile(w); }
  else { currentSearchId = null; $('notFound').classList.add('active'); }
};

function showProfile(w) {
  $('avatarInitial').textContent = (w.firstName || 'W')[0].toUpperCase();
  $('pName').textContent = w.firstName + ' ' + w.lastName;
  $('pId').textContent = w.id;
  $('pStatus').className = 'status-badge ' + (w.status === 'Active' ? 'status-active' : 'status-inactive');
  $('pStatusText').textContent = w.status;
  $('profileGrid').innerHTML = [
    ['NIC Number', w.nic], ['Date of Birth', w.dob], ['Phone', w.phone], ['Gender', w.gender],
    ['Address', w.address], ['District', w.district], ['Province', w.province],
    ['Assigned Center', w.center], ['Join Date', w.joinDate], ['Notes', w.notes],
  ].map(([label, val]) => `
    <div class="info-block"><div class="info-label">${label}</div><div class="info-value">${esc(val) || '—'}</div></div>`).join('');
  $('profileCard').classList.add('active');
}

// ---- TABLE ----
function renderTable(list) {
  const body = $('weaverTableBody');
  if (!list.length) { body.innerHTML = ''; $('emptyTable').style.display = 'block'; return; }
  $('emptyTable').style.display = 'none';
  body.innerHTML = list.map(w => `
    <tr onclick="quickView('${esc(w.id)}')">
      <td class="td-id">${esc(w.id)}</td>
      <td>${esc(w.firstName)} ${esc(w.lastName)}</td>
      <td>${esc(w.phone) || '—'}</td>
      <td><span class="tag-center">${esc(w.center)}</span></td>
      <td>${esc(w.district) || '—'}</td>
      <td><span class="status-badge ${w.status === 'Active' ? 'status-active' : 'status-inactive'}" style="display:inline-flex;"><span class="status-dot"></span>${esc(w.status)}</span></td>
      <td><button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openEditModal('${esc(w.id)}')">Edit</button></td>
    </tr>`).join('');
}

window.filterTable = function () {
  const name = $('searchName').value.toLowerCase();
  const center = $('centerFilter').value;
  const status = $('statusFilter').value;
  renderTable(weavers.filter(w =>
    (!name || (w.firstName + ' ' + w.lastName).toLowerCase().includes(name)) &&
    (!center || w.center === center) &&
    (!status || w.status === status)));
};

window.quickView = function (id) {
  const w = weavers.find(x => x.id === id);
  if (!w) return;
  $('searchId').value = w.id;
  currentSearchId = w.id;
  $('notFound').classList.remove('active');
  showProfile(w);
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ---- MODAL ----
window.openAddModal = function () {
  editingId = null;
  $('modalTitle').textContent = '➕ Add New Weaver';
  ['fId','fFirstName','fLastName','fNic','fPhone','fAddress','fDistrict','fProvince','fNotes','fDob','fJoin'].forEach(id => $(id).value = '');
  $('fStatus').value = 'Active';
  $('fGender').value = 'Female';
  $('fCenter').value = CENTERS[0];
  $('fId').disabled = false;
  $('modalOverlay').classList.add('active');
};

window.openEditModal = function (id) {
  const w = weavers.find(x => x.id === id);
  if (!w) return;
  editingId = id;
  $('modalTitle').textContent = '✏️ Edit Weaver — ' + id;
  $('fId').value = w.id; $('fId').disabled = true;
  $('fFirstName').value = w.firstName; $('fLastName').value = w.lastName;
  $('fNic').value = w.nic || ''; $('fDob').value = w.dob || '';
  $('fPhone').value = w.phone || ''; $('fGender').value = w.gender || 'Female';
  $('fAddress').value = w.address || ''; $('fDistrict').value = w.district || '';
  $('fProvince').value = w.province || ''; $('fCenter').value = w.center || CENTERS[0];
  $('fJoin').value = w.joinDate || ''; $('fStatus').value = w.status || 'Active';
  $('fNotes').value = w.notes || '';
  $('modalOverlay').classList.add('active');
};

window.editWeaver = () => { if (currentSearchId) window.openEditModal(currentSearchId); };
window.closeModal = () => $('modalOverlay').classList.remove('active');

window.deleteWeaver = async function () {
  if (!currentSearchId) return;
  if (!confirm('Delete weaver ' + currentSearchId + '? This cannot be undone.')) return;
  try {
    await deleteDoc(doc(weaversCol, currentSearchId));
    $('profileCard').classList.remove('active');
    $('searchId').value = '';
    currentSearchId = null;
    showToast('Weaver deleted successfully.');
  } catch (e) { showToast('⚠️ Delete failed: ' + e.code); }
};

window.saveWeaver = async function () {
  const id = editingId || $('fId').value.trim().toUpperCase();
  const firstName = $('fFirstName').value.trim();
  const lastName = $('fLastName').value.trim();
  if (!id || !firstName || !lastName) { showToast('⚠️ Please fill Weaver ID, First Name and Last Name.'); return; }
  if (/[\/\s]/.test(id)) { showToast('⚠️ Weaver ID cannot contain spaces or "/".'); return; }
  if (!editingId && weavers.find(w => w.id === id)) { showToast('⚠️ Weaver ID already exists!'); return; }

  const data = {
    id, firstName, lastName,
    nic: $('fNic').value.trim(), dob: $('fDob').value, phone: $('fPhone').value.trim(),
    gender: $('fGender').value, address: $('fAddress').value.trim(),
    district: $('fDistrict').value.trim(), province: $('fProvince').value.trim(),
    center: $('fCenter').value, joinDate: $('fJoin').value,
    status: $('fStatus').value, notes: $('fNotes').value.trim(),
  };
  try {
    await setDoc(doc(weaversCol, id), data);
    window.closeModal();
    showToast('✅ Weaver saved to cloud!');
  } catch (e) { showToast('⚠️ Save failed: ' + e.code); }
};

// ---- EXPORT CSV ----
window.exportCSV = function () {
  const headers = ['Weaver ID','First Name','Last Name','NIC','DOB','Phone','Gender','Address','District','Province','Center','Join Date','Status','Notes'];
  const rows = weavers.map(w => [w.id,w.firstName,w.lastName,w.nic,w.dob,w.phone,w.gender,w.address,w.district,w.province,w.center,w.joinDate,w.status,w.notes]
    .map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
  const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weavers_database.csv';
  a.click();
  showToast('📥 CSV exported!');
};

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
window.showToast = showToast;

</script>
</body>
</html>
